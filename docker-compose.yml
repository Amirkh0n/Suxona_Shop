# Local stack that mirrors production: Postgres + the API image.
#   cp backend/.env.example backend/.env     (fill in values; DJANGO_SECRET_KEY is required)
#   docker compose up --build
# API:  http://localhost:8000   Admin: http://localhost:8000/admin/   Health: /healthz
# The frontend is deployed separately (Cloudflare); run it with `npm run dev` in ./frontend.
services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    env_file:
      - backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      POSTGRES_HOST: db
      DATABASE_URL: ""            # compose uses the POSTGRES_* variables below
      DJANGO_SSL_REDIRECT: "false" # plain http on localhost
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      # No R2 configured -> uploads go to the volume and Django serves them.
      DJANGO_MEDIA_ROOT: /data/media
      DJANGO_SERVE_MEDIA: "true"
    ports:
      - "8000:8000"
    volumes:
      - media_data:/data/media
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-suxonashop}
      POSTGRES_USER: ${POSTGRES_USER:-suxonashop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-suxonashop}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-suxonashop}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  media_data:
