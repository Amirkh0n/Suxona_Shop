        telegram_id:
          type: string
          maxLength: 64
        username:
          type: string
          maxLength: 255
      required:
      - telegram_id
    TelegramVerify:
      type: object
      description: Validation-only serializer for the Telegram verification intake.
      properties:
        token:
          type: string
          maxLength: 64
        telegram_id:
          type: string
          maxLength: 64
        telegram_username:
          type: string
          maxLength: 255
      required:
      - telegram_id
      - token
    TelegramVerifyResponse:
      type: object
      description: Response body for a successful Telegram verification.
      properties:
        id:
          type: integer
        phone:
          type: string
        is_active:
          type: boolean
      required:
      - id
      - is_active
      - phone
    TokenPair:
      type: object
      description: JWT access/refresh token pair returned on login.
      properties:
        access:
          type: string
        refresh:
          type: string
      required:
      - access
      - refresh
    UserCompact:
      type: object
      description: Lightweight user representation for nesting in other read payloads.
      properties:
        id:
          type: integer
          readOnly: true
        phone:
          type: string
          readOnly: true
        first_name:
          type: string
          readOnly: true
      required:
      - first_name
      - id
      - phone
    UserDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        phone:
          type: string
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
      required:
      - first_name
      - id
      - is_active
      - last_name
      - phone
    Village:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        district:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
      required:
      - district
      - id
      - is_active
      - name
    VillageCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        district:
          type: string
          maxLength: 255
        is_active:
          type: boolean
          default: true
      required:
      - district
      - name
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
