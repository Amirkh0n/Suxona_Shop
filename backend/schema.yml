openapi: 3.0.3
info:
  title: SuxonaShop API
  version: 1.0.0
  description: Marketplace API for SuxonaShop
paths:
  /api/v1/addresses:
    get:
      operationId: addresses_list
      summary: List my addresses
      tags:
      - Users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AddressList'
          description: ''
    post:
      operationId: addresses_create
      summary: Create an address
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddressCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddressCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Validation or service error.
  /api/v1/addresses/{address_id}:
    get:
      operationId: addresses_retrieve
      summary: Get an address
      parameters:
      - in: path
        name: address_id
        schema:
          type: integer
        required: true
      tags:
      - Users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Not found.
    patch:
      operationId: addresses_partial_update
      summary: Update an address
      parameters:
      - in: path
        name: address_id
        schema:
          type: integer
        required: true
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAddressUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAddressUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAddressUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Validation or service error.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Not found.
    delete:
      operationId: addresses_destroy
      summary: Delete an address
      parameters:
      - in: path
        name: address_id
        schema:
          type: integer
        required: true
      tags:
      - Users
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Deleted.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Not found.
  /api/v1/admin/store-applications:
    get:
      operationId: admin_store_applications_list
      description: |-
        APIView base that exposes a helper for paginating selector querysets
        using the project-wide PageNumberPagination configuration.
      summary: List pending store applications (admin)
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStoreApplicationListList'
          description: ''
  /api/v1/admin/store-applications/{application_id}/approve:
    post:
      operationId: admin_store_applications_approve_create
      summary: Approve a store application (admin)
      parameters:
      - in: path
        name: application_id
        schema:
          type: integer
        required: true
      tags:
      - Admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreApplicationDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Service error.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Not found.
  /api/v1/admin/store-applications/{application_id}/reject:
    post:
      operationId: admin_store_applications_reject_create
      summary: Reject a store application (admin)
      parameters:
      - in: path
        name: application_id
        schema:
          type: integer
        required: true
      tags:
      - Admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreApplicationReject'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StoreApplicationReject'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StoreApplicationReject'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreApplicationDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Service error.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Not found.
  /api/v1/auth/login:
    post:
      operationId: auth_login_create
      description: Authenticates a user by phone + password and returns a JWT pair.
      summary: Obtain JWT tokens
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Invalid credentials.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Account not verified.
  /api/v1/auth/me:
    get:
      operationId: auth_me_retrieve
      summary: Get current user
      tags:
      - Auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
          description: ''
  /api/v1/auth/register:
    post:
      operationId: auth_register_create
      description: Creates an inactive user and returns a Telegram deep link the user
        must open to verify and activate their account.
      summary: Register a new user
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Validation or service error.
  /api/v1/auth/telegram/verify:
    post:
      operationId: auth_telegram_verify_create
      description: Called by the Telegram bot backend. Validates the verification
        token, links the Telegram account, and activates the user.
      summary: Complete Telegram verification
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramVerify'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TelegramVerify'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TelegramVerify'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramVerifyResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Forbidden / not configured.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Invalid token.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Telegram already linked.
        '410':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Token expired or consumed.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Verification not configured.
  /api/v1/banners/:
    get:
      operationId: banners_list
      summary: List active banners
      tags:
      - Banners
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BannerList'
          description: ''
    post:
      operationId: banners_create
      summary: Create a banner (admin)
      tags:
      - Banners
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BannerCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BannerCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BannerDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Validation or service error.
  /api/v1/banners/{banner_id}:
    get:
      operationId: banners_retrieve
      summary: Get a banner
      parameters:
      - in: path
        name: banner_id
        schema:
          type: integer
        required: true
      tags:
      - Banners
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BannerDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Not found.
    patch:
      operationId: banners_partial_update
      summary: Update a banner (admin)
      parameters:
      - in: path
        name: banner_id
        schema:
          type: integer
        required: true
      tags:
      - Banners
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBannerUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBannerUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BannerDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Validation or service error.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Not found.
    delete:
      operationId: banners_destroy
      summary: Delete a banner (admin)
      parameters:
      - in: path
        name: banner_id
        schema:
          type: integer
        required: true
      tags:
      - Banners
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Deleted.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Not found.
  /api/v1/cart:
    get:
      operationId: cart_retrieve
      summary: Get my cart (grouped by store)
      tags:
      - Cart
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
          description: ''
    delete:
      operationId: cart_destroy
      summary: Clear my cart
      tags:
      - Cart
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Cleared.
  /api/v1/cart/items:
    post:
      operationId: cart_items_create
      summary: Add an item to the cart
      tags:
      - Cart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CartItemCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CartItemCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItem'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Validation or service error.
  /api/v1/cart/items/{item_id}:
    patch:
      operationId: cart_items_partial_update
      summary: Update a cart item quantity
      parameters:
      - in: path
        name: item_id
        schema:
          type: integer
        required: true
      tags:
      - Cart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCartItemUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCartItemUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCartItemUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItem'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Validation or service error.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Not the cart owner.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Not found.
    delete:
      operationId: cart_items_destroy
      summary: Remove a cart item
      parameters:
      - in: path
        name: item_id
        schema:
          type: integer
        required: true
      tags:
      - Cart
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Removed.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Not the cart owner.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Not found.
  /api/v1/categories:
    get:
      operationId: categories_list
      description: |-
        APIView base exposing a helper to paginate selector querysets using the
        project-wide PageNumberPagination configuration.
      summary: List active categories
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Products
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCategoryList'
          description: ''
    post:
      operationId: categories_create
      description: |-
        APIView base exposing a helper to paginate selector querysets using the
        project-wide PageNumberPagination configuration.
      summary: Create a category (admin)
      tags:
      - Products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CategoryCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CategoryCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Validation or service error.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Parent not found.
  /api/v1/categories/{category_id}:
    get:
      operationId: categories_retrieve
      summary: Get a category
      parameters:
      - in: path
        name: category_id
        schema:
          type: integer
        required: true
      tags:
      - Products
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Not found.
    patch:
      operationId: categories_partial_update
      summary: Update a category (admin)
      parameters:
      - in: path
        name: category_id
        schema:
          type: integer
        required: true
      tags:
      - Products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCategoryUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCategoryUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCategoryUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Validation or service error.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Not found.
    delete:
      operationId: categories_destroy
      summary: Delete a category (admin)
      parameters:
      - in: path
        name: category_id
        schema:
          type: integer
        required: true
      tags:
      - Products
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Deleted.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Not found.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Has children or in use.
  /api/v1/delivery-zones:
    post:
      operationId: delivery_zones_create
      summary: Create a delivery zone
      tags:
      - Stores
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryZoneCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeliveryZoneCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeliveryZoneCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryZoneList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Validation or service error.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Not the store owner.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Store not found.
  /api/v1/delivery-zones/{zone_id}:
    patch:
      operationId: delivery_zones_partial_update
      summary: Update a delivery zone
      parameters:
      - in: path
        name: zone_id
        schema:
          type: integer
        required: true
      tags:
      - Stores
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDeliveryZoneUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDeliveryZoneUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDeliveryZoneUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryZoneList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Validation or service error.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Not the store owner.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Not found.
    delete:
      operationId: delivery_zones_destroy
      summary: Delete a delivery zone
      parameters:
      - in: path
        name: zone_id
        schema:
          type: integer
        required: true
      tags:
      - Stores
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Deleted.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Not the store owner.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Not found.
  /api/v1/orders:
    post:
      operationId: orders_create
      summary: Create an order from the store cart
      tags:
      - Orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrderCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrderCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Validation or service error.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Address not owned.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Store/address/zone not found.
  /api/v1/orders/{order_id}:
    get:
      operationId: orders_retrieve
      summary: Get an order
      parameters:
      - in: path
        name: order_id
        schema:
          type: integer
        required: true
      tags:
      - Orders
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Not found.
  /api/v1/orders/{order_id}/accept:
    post:
      operationId: orders_accept_create
      description: |-
        Base for seller order state-transition actions.

        Resolves the seller's store, scopes the order to that store (so a seller
